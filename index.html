
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090910">
<title>CAPRI // AI</title>
<style>
:root {
  --bg: #090910;
  --panel: #12121f;
  --cyan: #00f0ff;
  --pink: #ff2a6d;
  --text: #e6ffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: monospace;
}
header {
  padding: 26px 20px 18px;
  border-bottom: 1px solid #25253b;
  box-shadow: 0 4px 24px #00f0ff0b;
}
.tag { color: var(--pink); font-size: 11px; }
h1 {
  margin: 8px 0;
  color: var(--cyan);
  font-size: 38px;
  letter-spacing: 5px;
  text-shadow: 0 0 18px #00f0ff55;
}
.status { color: #85859e; font-size: 12px; }
main {
  max-width: 700px;
  margin: auto;
  padding: 20px 14px 120px;
}
.panel {
  background: var(--panel);
  border: 1px solid #292940;
  border-radius: 12px;
  padding: 16px;
}
.panel-title {
  color: var(--pink);
  font-size: 12px;
  margin-bottom: 14px;
}
#chat {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.message {
  padding: 12px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
.user {
  border-left: 3px solid var(--cyan);
  background: #00f0ff0b;
}
.capri {
  border-left: 3px solid var(--pink);
  background: #ff2a6d0b;
}
.name { font-size: 11px; margin-bottom: 6px; }
.user .name { color: var(--cyan); }
.capri .name { color: var(--pink); }
form {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
input {
  min-width: 0;
  flex: 1;
  padding: 14px 10px;
  border: 1px solid #393950;
  border-radius: 8px;
  background: #0b0b15;
  color: white;
  font: inherit;
}
input:focus {
  outline: 1px solid var(--cyan);
}
button {
  border: 0;
  border-radius: 8px;
  padding: 0 15px;
  background: var(--pink);
  color: #090910;
  font: bold 12px monospace;
}
button:active { opacity: .7; }
footer {
  text-align: center;
  color: #65657b;
  font-size: 10px;
  padding: 20px 0;
}
</style>
</head>
<body>
<header>
  <div class="tag">PERSONAL AI SYSTEM // PROTOTYPE 01</div>
  <h1>CAPRI<span style="color:#ff2a6d">_</span></h1>
  <div class="status">● INTERFACE ONLINE // WEB BUILD</div>
</header>
<main>
  <section class="panel">
    <div class="panel-title">// TERMINAL DE CONVERSA</div>
    <div id="chat" aria-live="polite">
      <div class="message capri">
        <div class="name">CAPRI // SISTEMA</div>
        Então você finalmente apareceu. Digite alguma coisa. Vamos descobrir se vale a pena processar suas ideias.
      </div>
    </div>
    <form id="form">
      <input id="message" placeholder="Fale comigo..." autocomplete="off" maxlength="1000" required>
      <button type="submit">ENVIAR</button>
    </form>
  </section>
  <footer>CAPRI WEB // VERSÃO EXPERIMENTAL</footer>
</main>

<script>
const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");

const API_URL =
  "https://capri-api-c22.murilorodriguescarneiro22.workers.dev";

function addMessage(name, text, type) {
  const box = document.createElement("div");
  box.className = "message " + type;

  const label = document.createElement("div");
  label.className = "name";
  label.textContent = name;

  const content = document.createElement("div");
  content.textContent = text;

  box.append(label, content);
  chat.appendChild(box);
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });

  return content;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  addMessage("VOCÊ", text, "user");
  input.value = "";

  const replyBox = addMessage(
    "CAPRI // IA",
    "Processando sua mensagem...",
    "capri"
  );

  const button = form.querySelector("button");
  button.disabled = true;
  input.disabled = true;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Erro ao consultar a IA.");
    }

    replyBox.textContent = data.reply || "A IA retornou uma resposta vazia.";

  } catch (error) {
    console.error(error);
    replyBox.textContent =
      "Não consegui me conectar à IA. Confira a configuração do Worker e tente novamente.";
  } finally {
    button.disabled = false;
    input.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
